name: Testes da API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar a API e os testes com relatório JUnit
        run: npm run test:ci

      - name: Publicar resultado dos testes no Pull Request
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Resultado dos testes Cypress
          path: results/*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true

      - name: Anexar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-cypress
          path: results/*.xml
          if-no-files-found: warn
          retention-days: 14
